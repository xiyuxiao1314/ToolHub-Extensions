<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolHub Extensions</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#15251e;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1120px;padding:52px 28px;margin:auto}header{border-bottom:1px solid #d3dfd8;padding-bottom:30px;margin-bottom:26px}header small{font:12px Consolas,monospace;letter-spacing:2px;color:#328265}h1{font-size:44px;letter-spacing:-1.6px;margin:10px 0}header p{color:#617267;max-width:650px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}input,select{border:1px solid #d0dbd3;border-radius:9px;padding:12px;background:white;color:inherit;font:inherit}input{flex:1;min-width:230px}#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}article{background:#fff;border:1px solid #d8e0db;border-radius:14px;padding:24px;display:flex;flex-direction:column}article h2{font-size:21px;margin:8px 0}article p{color:#617267;font-size:13px}article small{color:#617267}article footer{margin-top:auto;padding-top:20px}article a{display:inline-block;color:#126541;text-decoration:none;font-weight:600}article a:hover{text-decoration:underline}.tags{display:flex;gap:5px;flex-wrap:wrap;font-size:11px}.tags span{padding:3px 7px;background:#edf4ef;border-radius:5px}code{font-size:11px;overflow-wrap:anywhere}#count{font-size:12px;color:#617267}a{color:#126541}:focus-visible{outline:3px solid #218461;outline-offset:3px}</style><main><header><small>TOOLHUB / EXTENSION CATALOG</small><h1>让本机工具，多一种用法。</h1><p>独立 CLI 面板、交互页面、主题和通用流程。选择扩展，查看源码，再交给 ToolHub 安装。FFmpeg 面板需要 beta.4；macOS 执行暂不可用。</p><a href="README.md">安装说明与版本限制</a></header><nav aria-label="筛选扩展"><input id="query" aria-label="搜索扩展" placeholder="名称、用途或标签…"><select id="kind" aria-label="扩展类型"><option value="all">所有类型</option><option value="media">媒体 / CLI</option><option value="theme">主题</option><option value="page">交互页面</option><option value="recognition">识别规则 / Skill</option></select><select id="platform" aria-label="平台"><option value="all">所有平台</option><option value="windows">Windows</option><option value="macos">macOS</option><option value="linux">Linux</option></select></nav><p id="count" role="status"></p><section id="results" aria-label="扩展目录"></section><p><small>目录校验值不是作者签名。安装不会下载工具依赖；权限与真实平台支持以对应宿主为准。</small></p></main><script src="catalog.js"></script><script>
const q=document.querySelector('#query'),k=document.querySelector('#kind'),p=document.querySelector('#platform'),results=document.querySelector('#results');
function text(tag,value){const n=document.createElement(tag);n.textContent=value;return n}
function render(){results.replaceChildren();const rows=window.TOOLHUB_CATALOG.extensions.filter(r=>(k.value==='all'||r.category===k.value)&&(p.value==='all'||r.platforms.includes(p.value))&&[r.name,r.description,...r.tags].join(' ').toLowerCase().includes(q.value.toLowerCase()));document.querySelector('#count').textContent=`${rows.length} 个扩展`;for(const r of rows){const a=document.createElement('article');a.append(text('small',`${r.category.toUpperCase()} · v${r.version}`),text('h2',r.name),text('p',r.description));const tags=document.createElement('div');tags.className='tags';for(const tag of r.tags)tags.append(text('span',tag));a.append(tags,text('p',`${r.platforms.join(' / ')} · ToolHub ≥ ${r.min_toolhub_version}`),text('small',r.execution_support));const f=document.createElement('footer'),link=text('a','查看 / 下载扩展 JSON →');link.href=r.path;link.download=r.path.split('/').pop();f.append(link,text('p','SHA-256'),text('code',r.sha256));a.append(f);results.append(a)}}for(const el of[q,k,p])el.addEventListener('input',render);render();
</script></html>
