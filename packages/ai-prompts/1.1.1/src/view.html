<main id="library" aria-label="AI 提示词库">
  <header class="library-heading"><div class="library-name"><span class="quote-icon" aria-hidden="true">❞</span><div><span class="eyebrow">PROMPT LIBRARY</span><h1>找到合适的表达。</h1></div></div><span id="library-total" class="total"></span></header>
  <section class="filters" aria-label="筛选提示词">
    <div class="search-row"><label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" aria-label="搜索提示词" placeholder="搜索用途、关键词，例如：网页、代码审查、周报…" autocomplete="off"><kbd aria-hidden="true">⌘ / Ctrl K</kbd></label><div class="sort" role="group" aria-label="提示词排序"><button type="button" data-sort="recommended" aria-pressed="true">推荐</button><button type="button" data-sort="name" aria-pressed="false">名称</button></div></div>
    <div id="categories" class="categories" role="group" aria-label="提示词分类"></div>
  </section>
  <div id="load-error" class="error-line" role="alert" hidden></div>
  <div class="results-heading"><div><span id="results-label" role="status"></span> <button type="button" class="text-button" id="reset" hidden>清除筛选 ↗</button></div><div class="library-actions"><button id="add" class="primary" type="button">＋ 新增提示词</button><button id="import" class="small-button" type="button">导入</button><button id="export-all" class="small-button" type="button">导出全部</button></div></div>
  <section id="grid-space" class="grid-space" aria-label="提示词列表"><div id="grid" class="prompt-grid"></div><div id="empty" class="empty" hidden><span aria-hidden="true">⌕</span><h2>没有找到匹配的提示词</h2><p>试试更短的关键词，或换一个分类。</p><button type="button" class="primary" id="empty-reset">清除筛选</button></div></section>
  <footer class="pagination" aria-label="提示词分页"><span id="range"></span><div class="page-controls"><button type="button" id="previous" aria-label="上一页提示词">←</button><output id="page-label" aria-live="polite"></output><button type="button" id="next" aria-label="下一页提示词">→</button></div><span class="offline"><i aria-hidden="true"></i>离线可用</span></footer>
</main>
<div id="detail-overlay" class="detail-overlay" hidden><section class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title"><header class="detail-header"><div><span id="detail-category" class="eyebrow"></span><h2 id="detail-title"></h2><p id="detail-description"></p></div><button type="button" id="close-detail" class="close" aria-label="关闭提示词详情">×</button></header><div class="detail-meta"><div id="detail-tags" class="tags"></div><span id="detail-length"></span></div><label class="visually-hidden" for="prompt-text">完整提示词</label><textarea id="prompt-text" readonly spellcheck="false"></textarea><footer class="detail-footer"><span id="copy-hint">按需替换方括号里的内容。</span><button type="button" id="copy-detail" class="primary">复制提示词 ↗</button></footer></section></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<input type="file" id="import-files" accept=".md,.markdown,.txt,.json" multiple hidden>
<div id="manage-overlay" class="detail-overlay" hidden>
  <section class="detail manager" role="dialog" aria-modal="true" aria-labelledby="manage-title">
    <header class="detail-header"><div><span class="eyebrow">YOUR PROMPTS</span><h2 id="manage-title"></h2></div><button type="button" id="close-manage" class="close" aria-label="关闭管理窗口">×</button></header>
    <div id="manage-error" class="error-line" role="alert" hidden></div>
    <section id="editor" class="editor" hidden>
      <div class="edit-fields"><label class="wide">标题<input id="edit-title" maxlength="80" required></label><label>分类<input id="edit-category" maxlength="24" required placeholder="例如：我的提示词"></label><label>标签<input id="edit-tags" maxlength="210" placeholder="用逗号分隔，最多 8 个"></label><label class="wide">摘要<input id="edit-description" maxlength="180" placeholder="可选"></label></div>
      <label class="body-label" for="edit-content">提示词正文 <span id="edit-length"></span></label><textarea id="edit-content" maxlength="20000" required spellcheck="false" placeholder="写下你的提示词，支持 Markdown 文本…"></textarea>
      <footer class="manage-footer"><span id="save-note">保存在本机，导出后可分享。</span><button type="button" id="save" class="primary">保存提示词</button></footer>
    </section>
    <section id="import-panel" class="import-panel" hidden>
      <p id="import-summary"></p><div class="conflict-options" role="group" aria-label="导入冲突处理"><button type="button" data-conflict="keep" aria-pressed="true">保留现有</button><button type="button" data-conflict="replace" aria-pressed="false">以导入覆盖</button><button type="button" data-conflict="copy" aria-pressed="false">另存副本</button></div>
      <div id="import-list" class="import-list"></div><div class="import-pages"><button id="import-prev" type="button" class="small-button" aria-label="上一页导入预览">←</button><span id="import-page"></span><button id="import-next" type="button" class="small-button" aria-label="下一页导入预览">→</button></div>
      <footer class="manage-footer"><span id="import-effect"></span><button type="button" id="confirm-import" class="primary">确认导入</button></footer>
    </section>
    <section id="delete-panel" class="delete-panel" hidden><p id="delete-message"></p><p class="muted">只从提示词库移除，原始 Markdown 文件不受影响。删除后可立即撤销。</p><footer class="manage-footer"><button id="cancel-delete" type="button" class="small-button">取消</button><button type="button" id="confirm-delete" class="danger">删除提示词</button></footer></section>
  </section>
</div>
<div id="undo-bar" class="undo-bar" hidden><span>已删除提示词</span><button id="undo" class="small-button" type="button">撤销删除</button><button id="dismiss-undo" class="text-button" type="button" aria-label="关闭撤销提示">×</button></div>
